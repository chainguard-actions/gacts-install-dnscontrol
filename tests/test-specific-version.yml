name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: "4.12.4"

      - name: Assert dnscontrol-bin output is set
        env:
          BIN_PATH: ${{ steps.action.outputs.dnscontrol-bin }}
        run: |
          echo "dnscontrol-bin: $BIN_PATH"
          if [ -z "$BIN_PATH" ]; then
            echo "FAIL: dnscontrol-bin output is empty"
            exit 1
          fi
          echo "PASS: dnscontrol-bin output is set to '$BIN_PATH'"

      - name: Assert dnscontrol binary exists and is executable
        env:
          BIN_PATH: ${{ steps.action.outputs.dnscontrol-bin }}
        run: |
          echo "Checking binary at: $BIN_PATH"
          if [ ! -f "$BIN_PATH" ]; then
            echo "FAIL: binary file does not exist at '$BIN_PATH'"
            exit 1
          fi
          if [ ! -x "$BIN_PATH" ]; then
            echo "FAIL: binary file is not executable at '$BIN_PATH'"
            exit 1
          fi
          echo "PASS: binary exists and is executable"

      - name: Assert dnscontrol version matches requested version
        env:
          BIN_PATH: ${{ steps.action.outputs.dnscontrol-bin }}
        run: |
          echo "Running: $BIN_PATH version"
          VERSION_OUTPUT=$("$BIN_PATH" version 2>&1)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "4.12.4"; then
            echo "PASS: version 4.12.4 confirmed"
          else
            echo "FAIL: expected version 4.12.4 in output, got: $VERSION_OUTPUT"
            exit 1
          fi

      - name: Assert dnscontrol is on PATH
        run: |
          echo "Checking dnscontrol on PATH"
          if command -v dnscontrol >/dev/null 2>&1; then
            echo "PASS: dnscontrol found on PATH at $(command -v dnscontrol)"
          else
            echo "INFO: dnscontrol not on PATH (may be accessed via output path only)"
          fi
