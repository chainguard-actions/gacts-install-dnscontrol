name: Test install DNSControl (version with v prefix)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install DNSControl (version with v prefix)
        uses: .
        with:
          version: "v4.15.0"

      - name: Assert dnscontrol-bin output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dnscontrol-bin }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: dnscontrol-bin output is empty"
            exit 1
          fi
          echo "PASS: dnscontrol-bin output is set to: $ACTUAL"

      - name: Assert dnscontrol binary exists at reported path
        env:
          BIN_PATH: ${{ steps.action.outputs.dnscontrol-bin }}
        run: |
          echo "binary path: $BIN_PATH"
          if [ ! -f "$BIN_PATH" ]; then
            echo "FAIL: binary not found at $BIN_PATH"
            exit 1
          fi
          echo "PASS: binary exists at $BIN_PATH"

      - name: Assert dnscontrol is on PATH
        run: |
          if ! command -v dnscontrol &>/dev/null; then
            echo "FAIL: dnscontrol not found in PATH"
            exit 1
          fi
          echo "PASS: dnscontrol found at $(command -v dnscontrol)"

      - name: Assert install path does not contain 'v' prefix (v prefix was stripped)
        env:
          BIN_PATH: ${{ steps.action.outputs.dnscontrol-bin }}
        run: |
          echo "binary path: $BIN_PATH"
          # The action strips the 'v' prefix, so the path should contain '4.15.0' not 'v4.15.0'
          if echo "$BIN_PATH" | grep -q "dnscontrol-4.15.0"; then
            echo "PASS: path contains version without 'v' prefix: $BIN_PATH"
          elif echo "$BIN_PATH" | grep -q "dnscontrol-v4.15.0"; then
            echo "FAIL: path still contains 'v' prefix, stripping did not work: $BIN_PATH"
            exit 1
          else
            echo "PASS: binary path format is: $BIN_PATH (version prefix handling verified by successful install)"
          fi

      - name: Assert dnscontrol version command works
        run: |
          dnscontrol version
          echo "PASS: dnscontrol version command succeeded"
